# Gọi route nhắc việc mỗi ~10 phút (docs/deploy-vercel-ios.md, mục 9 "Nhắc việc tự động").
# Cần hai repository secret: APP_URL (https://ten-app.vercel.app) và CRON_SECRET (giống trên Vercel), rồi mới bật
# repository variable REMINDERS_ENABLED=true (Settings → Secrets and variables → Actions → Variables). Chưa bật biến thì
# lịch bỏ qua job (không có lần chạy đỏ trước khi đặt secret); nút "Run workflow" (chạy tay) luôn chạy để thử.
# Phút GitHub Actions chỉ miễn phí cho repo công khai: repo riêng tư lịch 10 phút tốn ~4.400 phút/tháng (vượt 2.000
# phút miễn phí) — đổi sang "*/30 * * * *" hoặc dùng bộ gọi ngoài (cron-job.org), xem docs/deploy-vercel-ios.md mục 9.
# Lịch của GitHub chỉ chạy trên nhánh mặc định, có thể trễ (khoảng cách tối thiểu 5 phút) và bị GitHub tự tắt sau
# 60 ngày repo không có hoạt động. Cửa sổ nhắc của app dài 2,5 giờ nên trễ vài phút không sao.
name: Nhắc việc

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || vars.REMINDERS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Gọi /api/cron/nhac-viec
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +x
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Thiếu repository secret APP_URL hoặc CRON_SECRET (xem docs/deploy-vercel-ios.md mục 9)."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *)
              echo "::error::APP_URL phải bắt đầu bằng https://"
              exit 1
              ;;
          esac
          # Header đi qua stdin (-H @-): bí mật không nằm trong argv của curl (printf là lệnh có sẵn của shell).
          printf 'Authorization: Bearer %s\n' "$CRON_SECRET" | \
            curl --fail --silent --show-error --max-time 65 -H @- "${APP_URL%/}/api/cron/nhac-viec"
